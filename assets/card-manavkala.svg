<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="Manavkala">
<defs>
<linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#FB7185"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#151B3D"/></linearGradient>
<clipPath id="cd"><rect width="600" height="200" rx="16"/></clipPath>
</defs>
<style>
.t{font:700 26px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#F8FAFC}
.d{font:400 14.5px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#CBD5E1}
.u{font:600 13.5px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#F472B6}
.g{font:700 11px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#0B1020;letter-spacing:.7px}
.glow{animation:pl 4s ease-in-out infinite}
.arrow{animation:mv 2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.22}50%{opacity:.5}}
@keyframes mv{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
</style>
<rect x=".5" y=".5" width="599" height="199" rx="16" fill="url(#bd)" stroke="#26325F"/>
<g clip-path="url(#cd)"><circle class="glow" cx="545" cy="25" r="95" fill="url(#gd)"/></g>
<rect x="0" y="26" width="5" height="148" rx="2.5" fill="url(#gd)"/>
<rect x="28" y="26" width="152" height="22" rx="11" fill="url(#gd)"/>
<text class="g" x="40" y="41">WEB · TYPESCRIPT</text>
<text class="t" x="28" y="88">Manavkala</text>
<text class="d" x="28" y="118">A web project built with TypeScript.</text>

<text class="u" x="28" y="176">manavkala.com</text>
<g class="arrow"><path d="M540 170h28m-9-9 9 9-9 9" stroke="url(#gd)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
